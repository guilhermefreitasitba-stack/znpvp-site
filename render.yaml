services:
  - type: web
    name: znpvp-site
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/content
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: STAFF_PASSWORD
        sync: false
      - key: DB_FILE
        value: /var/data/znpvp.sqlite
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: znpvp-data
      mountPath: /var/data
      sizeGB: 1
